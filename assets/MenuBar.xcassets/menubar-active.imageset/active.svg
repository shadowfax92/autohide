<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- autohide active. Template glyph: the menu bar keeps the alpha and supplies the colour.
       Every edge sits on the pixel grid so @1x is sharp. Paint order is back to front. -->
  <!-- Furthest window, 25%: drawn only where back-1 does not cover it, so the two
       translucent shapes never overlap and stack their alpha. -->
  <path d="M15 9H15.5A1.5 1.5 0 0 1 17 10.5V13.5A1.5 1.5 0 0 1 15.5 15H11.5A1.5 1.5 0 0 1 10 13.5V13H13.5A1.5 1.5 0 0 0 15 11.5Z" fill="#000" fill-opacity="0.25"/>
  <!-- Nearer window behind, 55%; the opaque front window covers the rest of it. -->
  <rect x="6" y="6" width="9" height="7" rx="1.5" fill="#000" fill-opacity="0.55"/>
  <!-- The window in use, opaque: title bar, a one-pixel gap, then the body. -->
  <path d="M4 3H11A2 2 0 0 1 13 5H2A2 2 0 0 1 4 3Z" fill="#000"/>
  <path d="M2 6H13V9A2 2 0 0 1 11 11H4A2 2 0 0 1 2 9Z" fill="#000"/>
</svg>
